<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina Choi — Portfolio</title>
<link rel="icon" href="img/logoblack.png" type="image/png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
    }

    #video-stage {
        position: fixed; inset: 0;
        background: #000;
    }

    #intro-video {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }

    /* Click-to-start overlay (needed for autoplay-with-sound policies) */
    #start-overlay {
        position: fixed; inset: 0;
        z-index: 30;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.35);
        cursor: pointer;
        transition: opacity 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }

    .start-pill {
        padding: 16px 34px;
        border-radius: 999px;
        border: 1.5px solid rgba(255,255,255,0.7);
        font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        color: #fff;
        animation: pulse-pill 1.8s ease-in-out infinite;
    }
    @keyframes pulse-pill { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* Skip */
    .skip-intro {
        position: fixed; bottom: 20px; right: 24px; z-index: 40;
        font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
        color: rgba(255,255,255,0.55); text-decoration: none;
        border-bottom: 1px solid rgba(255,255,255,0.35);
    }

    /* ---------- Post-video prompt ---------- */
    #prompt-overlay {
        position: fixed; inset: 0;
        z-index: 20;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column;
        background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0.15) 40%, transparent 70%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
        padding: 24px;
        text-align: center;
    }
    #prompt-overlay.show { opacity: 1; pointer-events: auto; }

    .prompt-text {
        font-size: clamp(22px, 4vw, 36px);
        font-weight: 700;
        letter-spacing: -0.01em;
        margin-bottom: 34px;
        text-shadow: 0 2px 20px rgba(0,0,0,0.4);
    }

    .prompt-actions {
        display: flex; gap: 16px;
        position: relative;
        min-height: 56px;
    }

    .prompt-btn {
        padding: 15px 40px;
        border-radius: 999px;
        font-size: 13.5px; font-weight: 700; letter-spacing: 0.03em;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .prompt-btn.yes {
        background: #fff; color: #111; border: none;
    }
    .prompt-btn.yes:hover { transform: scale(1.05); }
    .prompt-btn.no {
        background: transparent; color: #fff;
        border: 1.5px solid rgba(255,255,255,0.6);
        position: relative;
    }
    .prompt-btn.no.dodging { position: absolute; }

    @media (max-width: 480px) {
        .prompt-actions { flex-direction: column; align-items: center; gap: 12px; }
    }
</style>
</head>
<body>

<div id="video-stage">
    <video id="intro-video" src="img/intro.mp4" playsinline muted></video>
</div>

<div id="start-overlay">
    <div class="start-pill">Click to Begin</div>
</div>

<div id="prompt-overlay">
    <div class="prompt-text">Would you like to work with Mina?</div>
    <div class="prompt-actions" id="promptActions">
        <button class="prompt-btn yes" id="promptYes">Yes</button>
        <button class="prompt-btn no" id="promptNo">No</button>
    </div>
</div>

<a href="main.html" class="skip-intro">Skip Intro</a>

<script>
    const video = document.getElementById('intro-video');
    const startOverlay = document.getElementById('start-overlay');
    const promptOverlay = document.getElementById('prompt-overlay');
    const promptActions = document.getElementById('promptActions');
    const promptYes = document.getElementById('promptYes');
    const promptNo = document.getElementById('promptNo');

    function beginPlayback() {
        video.muted = false;
        video.currentTime = 0;
        video.play().catch(() => {
            // Sound blocked — fall back to muted playback so the visual still plays
            video.muted = true;
            video.play().catch(() => {});
        });
        startOverlay.classList.add('hidden');
    }

    startOverlay.addEventListener('click', beginPlayback, { once: true });

    // Also allow autoplay attempt on load (muted) in case the browser permits it,
    // but we still show the click-to-begin so sound reliably works.
    video.addEventListener('ended', () => {
        promptOverlay.classList.add('show');
    });

    promptYes.addEventListener('click', () => {
        window.location.href = 'main.html';
    });

    // "No" dodges the cursor so it's effectively unclickable
    promptNo.addEventListener('mouseenter', () => {
        promptNo.classList.add('dodging');
        const bounds = promptActions.getBoundingClientRect();
        const btnW = promptNo.offsetWidth;
        const btnH = promptNo.offsetHeight;
        const maxX = Math.max(0, bounds.width - btnW);
        const maxY = Math.max(0, 40);
        promptNo.style.left = (Math.random() * maxX) + 'px';
        promptNo.style.top = (Math.random() * maxY - 20) + 'px';
    });
    promptNo.addEventListener('touchstart', (e) => {
        e.preventDefault();
        promptNo.dispatchEvent(new Event('mouseenter'));
    });
</script>
</body>
</html>
