<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina Choi — Portfolio</title>
<link rel="icon" href="img/logoblack.png" type="image/png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
    }

    #video-stage {
        position: fixed; inset: 0;
        background: #000;
    }

    #intro-video {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }

    /* Click-to-start overlay (needed for autoplay-with-sound policies) */
    #start-overlay {
        position: fixed; inset: 0;
        z-index: 30;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.35);
        cursor: pointer;
        transition: opacity 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }

    .start-pill {
        padding: 16px 34px;
        border-radius: 999px;
        border: 1.5px solid rgba(255,255,255,0.7);
        font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
        color: #fff;
        animation: pulse-pill 1.8s ease-in-out infinite;
    }
    @keyframes pulse-pill { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* Skip */
    .skip-intro {
        position: fixed; bottom: 20px; right: 24px; z-index: 40;
        font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
        color: rgba(255,255,255,0.55); text-decoration: none;
        border-bottom: 1px solid rgba(255,255,255,0.35);
    }

    /* ---------- Fade-out transition ---------- */
    #fade-overlay {
        position: fixed; inset: 0;
        z-index: 20;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.6s ease;
    }
    #fade-overlay.show { opacity: 1; }

    /* ---------- Enter button (shown once video ends on its final frame) ---------- */
    #enter-overlay {
        position: fixed; inset: 0;
        z-index: 15;
        display: flex; align-items: flex-end; justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
        padding: 0 24px 14%;
    }
    #enter-overlay.show { opacity: 1; pointer-events: auto; }

    .enter-btn {
        padding: 16px 44px;
        border-radius: 999px;
        border: 1.5px solid rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.25);
        backdrop-filter: blur(6px);
        color: #fff;
        font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .enter-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<div id="video-stage">
    <video id="intro-video" src="img/intro.mp4" playsinline muted></video>
</div>

<div id="start-overlay">
    <div class="start-pill">Click to Begin</div>
</div>

<div id="enter-overlay">
    <button class="enter-btn" id="enterBtn">Enter Portfolio</button>
</div>
<div id="fade-overlay"></div>

<a href="main.html" class="skip-intro">Skip Intro</a>

<script>
    const video = document.getElementById('intro-video');
    const startOverlay = document.getElementById('start-overlay');
    const enterOverlay = document.getElementById('enter-overlay');
    const fadeOverlay = document.getElementById('fade-overlay');
    const enterBtn = document.getElementById('enterBtn');

    function beginPlayback() {
        video.muted = false;
        video.currentTime = 0;
        video.play().catch(() => {
            // Sound blocked — fall back to muted playback so the visual still plays
            video.muted = true;
            video.play().catch(() => {});
        });
        startOverlay.classList.add('hidden');
    }

    startOverlay.addEventListener('click', beginPlayback, { once: true });

    // Video naturally freezes on its final frame when it ends (no loop) —
    // that's where "WOULD YOU LIKE TO SEE HER JOURNEY?" is baked into the footage.
    video.addEventListener('ended', () => {
        enterOverlay.classList.add('show');
    });

    enterBtn.addEventListener('click', () => {
        fadeOverlay.classList.add('show');
        setTimeout(() => {
            window.location.href = 'main.html';
        }, 1200);
    });
</script>
</body>
</html>
