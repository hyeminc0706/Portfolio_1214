<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina Choi — Portfolio</title>
<link rel="icon" href="img/logoblack.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #ffffff;
    }

    #stage {
        position: fixed; inset: 0;
        z-index: 1;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
        perspective: 1400px;
    }

    #tilt-wrap {
        transform-style: preserve-3d;
        will-change: transform;
    }

    .scene {
        position: relative;
        width: min(620px, 92vw);
        transform-style: preserve-3d;
        will-change: transform;
        animation: idle-float 3.2s ease-in-out infinite;
    }
    @keyframes idle-float {
        0%, 100% { transform: translateY(0) translateZ(0) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-14px) translateZ(30px) rotateX(3deg) rotateY(-1.5deg); }
    }
    .scene.notice {
        animation: notice-bounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes notice-bounce {
        0% { transform: translateZ(0) rotateX(0deg) rotateY(0deg) scale(1); }
        30% { transform: translateZ(60px) rotateX(-8deg) rotateY(4deg) scale(1.07, 0.95); }
        55% { transform: translateZ(-10px) rotateX(4deg) rotateY(-3deg) scale(0.97, 1.04); }
        100% { transform: translateZ(0) rotateX(0deg) rotateY(0deg) scale(1); }
    }
    .scene.wiggle {
        animation: wiggle 0.9s ease-in-out;
    }
    @keyframes wiggle {
        0%, 100% { transform: rotateY(0deg) rotateZ(0deg); }
        25% { transform: rotateY(-9deg) rotateZ(-2deg); }
        75% { transform: rotateY(9deg) rotateZ(2deg); }
    }

    .scene img {
        width: 100%; display: block;
        filter: drop-shadow(0 30px 40px rgba(30, 90, 140, 0.25));
        backface-visibility: hidden;
    }

    .ground-shadow {
        position: absolute;
        left: 50%; bottom: -18px;
        transform: translateX(-50%);
        width: 62%; height: 26px;
        background: radial-gradient(ellipse at center, rgba(30,60,100,0.28) 0%, rgba(30,60,100,0) 72%);
        border-radius: 50%;
        z-index: -1;
        animation: shadow-pulse 3.2s ease-in-out infinite;
    }
    @keyframes shadow-pulse {
        0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
        50% { transform: translateX(-50%) scale(0.82); opacity: 0.65; }
    }

    /* ---------- Speech bubble ---------- */
    .bubble {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translate(-50%, -100%) scale(0.85);
        background: #fff;
        border-radius: 24px;
        padding: 16px 22px;
        max-width: 380px;
        min-width: 220px;
        text-align: center;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 19px;
        line-height: 1.35;
        color: #C0328C;
        box-shadow: 0 14px 30px rgba(30, 90, 140, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .bubble::after {
        content: "";
        position: absolute;
        bottom: -14px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 16px solid #fff;
    }
    .bubble.show {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
    }

    /* ---------- Prompt (question + buttons) ---------- */
    #prompt-wrap {
        position: absolute;
        left: 50%;
        bottom: -8px;
        transform: translate(-50%, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        width: 100%;
    }
    #prompt-wrap.show { opacity: 1; pointer-events: auto; }

    .prompt-question {
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 24px;
        color: #3A2E6B;
        text-align: center;
        text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    }

    .prompt-actions {
        display: flex; gap: 14px;
        position: relative;
        min-height: 58px;
    }

    .prompt-btn {
        padding: 14px 32px;
        border-radius: 999px;
        font-family: 'Baloo 2', sans-serif;
        font-size: 16px; font-weight: 700;
        cursor: pointer;
        border: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
        white-space: nowrap;
    }
    .prompt-btn.yes {
        background: #FF6FA5;
        color: #fff;
        box-shadow: 0 6px 0 #D94F86;
    }
    .prompt-btn.yes:hover { transform: translateY(-2px); }
    .prompt-btn.yes:active { transform: translateY(2px); box-shadow: 0 2px 0 #D94F86; }
    .prompt-btn.no {
        background: #fff;
        color: #7A6FB0;
        border: 2px solid #C9C0F0;
        position: relative;
    }
    .prompt-btn.no.dodging { position: absolute; }

    /* No-button taunt bubble */
    .no-taunt {
        position: absolute;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border-radius: 16px;
        padding: 10px 16px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700;
        font-size: 13.5px;
        color: #C0328C;
        white-space: nowrap;
        box-shadow: 0 10px 20px rgba(30,90,140,0.18);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
    }
    .no-taunt::after {
        content: "";
        position: absolute;
        bottom: -8px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 9px solid #fff;
    }
    .no-taunt.show { opacity: 1; }

    /* Click-to-start (autoplay-friendly) */
    #start-overlay {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: rgba(90, 160, 210, 0.25);
        cursor: pointer;
        transition: opacity 0.5s ease;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }
    #start-overlay { background: rgba(0,0,0,0.04); }
    .start-pill {
        padding: 14px 30px;
        border-radius: 999px;
        background: #fff;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 700; font-size: 14px;
        color: #7A6FB0;
        box-shadow: 0 10px 24px rgba(30,90,140,0.2);
        animation: pulse-pill 1.8s ease-in-out infinite;
    }
    @keyframes pulse-pill { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    #fade-overlay {
        position: fixed; inset: 0; z-index: 60;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
    }
    #fade-overlay.show { opacity: 1; }

    .skip-intro {
        position: fixed; bottom: 18px; right: 22px; z-index: 55;
        font-family: 'Baloo 2', sans-serif;
        font-size: 12px; font-weight: 700;
        color: rgba(58,46,107,0.55);
        text-decoration: none;
        border-bottom: 1.5px solid rgba(58,46,107,0.3);
    }

    @media (max-width: 480px) {
        .bubble { font-size: 16px; max-width: 260px; min-width: 180px; padding: 12px 16px; }
        .prompt-question { font-size: 19px; }
        .prompt-btn { padding: 12px 24px; font-size: 14px; }
    }
</style>
</head>
<body>

<div id="stage">
    <div id="tilt-wrap">
        <div class="scene" id="scene">
            <img src="img/minavatar-cutout.png" alt="Mina's avatar">
            <div class="ground-shadow"></div>

            <div class="bubble" id="bubble"></div>

            <div id="prompt-wrap">
                <div class="prompt-question" id="promptQuestion"></div>
                <div class="prompt-actions" id="promptActions">
                    <button class="prompt-btn yes" id="promptYes">Yes, let's go!</button>
                    <button class="prompt-btn no" id="promptNo">
                        Still thinking (No)
                        <span class="no-taunt" id="noTaunt"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="start-overlay">
    <div class="start-pill">Click to Begin</div>
</div>

<div id="fade-overlay"></div>

<a href="main.html" class="skip-intro">Skip Intro</a>

<script>
    const scene = document.getElementById('scene');
    const tiltWrap = document.getElementById('tilt-wrap');
    const bubble = document.getElementById('bubble');
    const promptWrap = document.getElementById('prompt-wrap');
    const promptQuestion = document.getElementById('promptQuestion');
    const promptActions = document.getElementById('promptActions');
    const promptYes = document.getElementById('promptYes');
    const promptNo = document.getElementById('promptNo');
    const noTaunt = document.getElementById('noTaunt');
    const startOverlay = document.getElementById('start-overlay');
    const fadeOverlay = document.getElementById('fade-overlay');

    function showBubble(text, duration) {
        return new Promise(resolve => {
            bubble.textContent = text;
            requestAnimationFrame(() => bubble.classList.add('show'));
            setTimeout(() => {
                bubble.classList.remove('show');
                setTimeout(resolve, 350);
            }, duration);
        });
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runSequence() {
        await wait(900);

        // She notices you
        scene.classList.add('notice');
        setTimeout(() => scene.classList.remove('notice'), 600);
        await wait(300);

        await showBubble("Oh, hi there! Did you come to see my portfolio?", 2600);

        // Little shrug/wiggle
        scene.classList.add('wiggle');
        setTimeout(() => scene.classList.remove('wiggle'), 900);
        await wait(150);

        await showBubble("I might be entry-level, but I bring 4 years of real-world business & marketing muscle to UX design!", 3400);

        // Main question
        promptQuestion.textContent = "Care to take a quick look around?";
        promptWrap.classList.add('show');
    }

    function beginPlayback() {
        startOverlay.classList.add('hidden');
        runSequence();
    }

    startOverlay.addEventListener('click', beginPlayback, { once: true });

    // ---------- No button: dodges with escalating taunts, then gives up ----------
    const taunts = [
        "Oops, looks like your cursor slipped! 😉",
        "Come on, you're not going to reject her with this much passion, right?",
        "Okay, I'll stop running—just click 'Yes' right next door, please! 🥹"
    ];
    let dodgeCount = 0;

    promptNo.addEventListener('mouseenter', () => {
        if (dodgeCount >= taunts.length) return; // she's given up, button stays put now

        const taunt = taunts[dodgeCount];
        dodgeCount++;

        noTaunt.textContent = taunt;
        noTaunt.classList.add('show');
        setTimeout(() => noTaunt.classList.remove('show'), 1800);

        promptNo.classList.add('dodging');
        const bounds = promptActions.getBoundingClientRect();
        const btnW = promptNo.offsetWidth;
        const maxX = Math.max(0, bounds.width - btnW);
        const maxY = 36;
        promptNo.style.left = (Math.random() * maxX) + 'px';
        promptNo.style.top = (Math.random() * maxY - 18) + 'px';
    });

    promptNo.addEventListener('touchstart', (e) => {
        if (dodgeCount < taunts.length) {
            e.preventDefault();
            promptNo.dispatchEvent(new Event('mouseenter'));
        }
    });

    promptNo.addEventListener('click', () => {
        // She warned you she'd stop running — clicking through still leads to the portfolio
        goToPortfolio();
    });

    promptYes.addEventListener('click', goToPortfolio);

    function goToPortfolio() {
        fadeOverlay.classList.add('show');
        setTimeout(() => { window.location.href = 'main.html'; }, 1000);
    }

    // ---------- Mouse-driven 3D parallax tilt (separate layer from the keyframe bounce/wiggle) ----------
    let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;

    window.addEventListener('mousemove', (e) => {
        const nx = (e.clientX / window.innerWidth) - 0.5;
        const ny = (e.clientY / window.innerHeight) - 0.5;
        targetRY = nx * 14;
        targetRX = -ny * 10;
    });

    function tiltLoop() {
        curRX += (targetRX - curRX) * 0.06;
        curRY += (targetRY - curRY) * 0.06;
        tiltWrap.style.transform = `rotateX(${curRX}deg) rotateY(${curRY}deg)`;
        requestAnimationFrame(tiltLoop);
    }
    requestAnimationFrame(tiltLoop);
</script>
</body>
</html>
